# The frontend's nginx: serves the built SPA, and proxies /api/ to the gateway over frontend_net, so the browser only
# ever talks to one origin (no CORS, and the bundle's VITE_API_BASE_URL default of /api/v1 just works)

# Upgrade the connection only when the client asks to (for the planned notification WebSockets)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the scheme the outer proxy (TLS termination) saw; fall back to ours when there's no outer proxy
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 3000;
    client_max_body_size 50M;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Looking "gateway" up per request (proxy_pass via a variable) instead of once at startup
    # means nginx starts even when the gateway isn't up yet, and follows it when a deploy recreates it with a new IP
    # (a startup-time lookup would 502 until this container restarted)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $gateway http://gateway:8080;
        # with a variable and no URI part, the request's path (/api/v1/...) and query pass through unchanged
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # appends this hop, so the gateway (with TRUST_PROXY set) can find the real client IP for rate limiting
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Vite's hashed build output never changes under the same name, so it can be cached for good. A missing asset is a
    # 404, not the SPA fallback (which would hand the browser HTML where it expects JS after a deploy)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the SPA: index.html revalidates on every load, so a deploy's new asset hashes are picked up
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
