syntax = "proto3";

package authentication;
import "google/protobuf/timestamp.proto";

message User {
    string id = 1;
    string google_id = 2;
    string email = 3;
    string name = 4;
    string avatar_url = 5;
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp updated_at = 7;
    google.protobuf.Timestamp deleted_at = 8;
}

message SignInUserRequest {
    string google_auth_token = 1;
}

message SignInUserResponse {
    User user = 1;
    bool created = 2;
}

message SoftValidateJwtRequest {
    string jwt = 1;
}

message SoftValidateJwtResponse {
    User user = 1;
    bool valid = 2;
}

message DeleteUserRequest {
    string user_id = 1;
}

message DeleteUserResponse {
    bool deleted = 1;
}

service AuthenticationService {
    rpc SignInUser (SignInUserRequest) returns (SignInUserResponse);
    rpc SoftValidateJwt (SoftValidateJwtRequest) returns (SoftValidateJwtResponse);
    rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
}