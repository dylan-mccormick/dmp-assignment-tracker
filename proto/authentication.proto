syntax = "proto3";

package authentication;
import "google/protobuf/timestamp.proto";

message User {
    string id = 1;
    string google_id = 2;
    string email = 3;
    string name = 4;
    string avatar_url = 5;
    int32 token_version = 9;
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp updated_at = 7;
    google.protobuf.Timestamp deleted_at = 8;
}

message SignInUserRequest {
    string google_auth_code = 1;
}

message SignInUserResponse {
    User user = 1;
    string jwt = 3;
    bool created = 2;
    bool restored = 4; // a soft-deleted account was restored by signing in
}

message SoftValidateJwtRequest {
    string jwt = 1;
}

message SoftValidateJwtResponse {
    User user = 1;
    bool valid = 2;
}

message LogOutUserRequest {
    string user_id = 1;
}

message LogOutUserResponse {
    bool logged_out = 1;
}

message GetUserRequest {
    string user_id = 1;
}

message GetUserResponse {
    User user = 1;
}

message DeleteUserRequest {
    string user_id = 1;
}

message DeleteUserResponse {
    bool deleted = 1;
}

service AuthenticationService {
    rpc SignInUser (SignInUserRequest) returns (SignInUserResponse);
    rpc SoftValidateJwt (SoftValidateJwtRequest) returns (SoftValidateJwtResponse);
    rpc LogOutUser (LogOutUserRequest) returns (LogOutUserResponse);
    rpc GetUser (GetUserRequest) returns (GetUserResponse);
    rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
}