services:

    # development port bindings

    postgres-auth:
        ports:
            - 5433:5432

    postgres-assignment:
        ports:
            - 5434:5432

    redis:
        ports:
            - 6379:6379

    rabbitmq:
        image: rabbitmq:4-management-alpine # allow dev ui
        ports:
            - 5672:5672
            - 15672:15672

    gateway:
        build:
            target: dev
            context: .
            dockerfile: ./gateway/Dockerfile
        environment:
            PORT: 8080
            CI: true
            NODE_ENV: development
            JWT_SECRET: ${JWT_SECRET}
            AUTH_SERVICE_URL: auth-service:50051
            ASSIGNMENT_SERVICE_URL: assignment-service:50052
            REDIS_URL: redis://redis:6379
        volumes:
            - ./gateway:/app
            - /app/node_modules
        ports:
            - 8080:8080
        command: pnpm dev

    auth-service:
        build:
            target: dev
            context: .
            dockerfile: ./services/auth/Dockerfile
        environment:
            CI: true
            NODE_ENV: development
            DATABASE_URL: postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@postgres-auth:5432/auth
            REDIS_URL: redis://redis:6379
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            JWT_SECRET: ${JWT_SECRET}
        volumes:
            - ./services/auth:/app
            - /app/node_modules
        ports:
            - 50051:50051
        command: pnpm dev

    assignment-service:
        build:
            target: dev
            context: .
            dockerfile: ./services/assignment/Dockerfile
        environment:
            CI: true
            NODE_ENV: development
            DATABASE_URL: postgres://${ASSIGNMENT_DB_USER}:${ASSIGNMENT_DB_PASSWORD}@postgres-assignment:5432/assignments
            REDIS_URL: redis://redis:6379
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
        volumes:
            - ./services/assignment:/app
            - /app/node_modules
        ports:
            - 50052:50052
        command: pnpm dev

    notification-service:
        build:
            target: dev
            context: .
            dockerfile: ./services/notification/Dockerfile
        environment:
            CI: true
            NODE_ENV: development
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
        volumes:
            - ./services/notification:/app
            - /app/node_modules
        command: pnpm dev

    stats-service:
        build:
            target: dev
            context: .
            dockerfile: ./services/stats/Dockerfile
        environment:
            CI: true
            NODE_ENV: development
            REDIS_URL: redis://redis:6379
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
            ASSIGNMENT_SERVICE_URL: assignment-service:50052
        volumes:
            - ./services/stats:/app
            - /app/node_modules
        ports:
            - 50053:50053
        command: pnpm dev

    frontend:
        build:
            target: dev
            context: ./frontend
        environment:
            CI: true
            VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            VITE_API_BASE_URL: /api/v1
            API_PROXY_TARGET: http://gateway:8080
        volumes:
            - ./frontend:/app
            - /app/node_modules
        ports:
            - 3000:3000
        command: pnpm dev