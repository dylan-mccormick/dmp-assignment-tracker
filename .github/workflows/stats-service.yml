name: Stats Service - Build and Deploy

on:
    push:
        branches: [main]
        paths:
            - 'services/stats/**'
            - 'proto/**'
            - '.github/workflows/stats-service.yml'

concurrency:
    group: stats-service-deploy
    cancel-in-progress: false

env:
    IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stats-service

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Log into GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Set Image Tag
              id: meta
              run: echo "tag=${{ github.sha }}" >> $GITHUB_ENV

            - name: Build and Push (Prod Target)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./services/stats/Dockerfile
                  target: prod
                  push: true
                  tags: |
                    ${{ env.IMAGE_NAME }}:${{ env.tag }}
                    ${{ env.IMAGE_NAME }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        runs-on: ubuntu-latest
        needs: build-and-push
        steps:
            - name: Deploy to Prod Host
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key: ${{ secrets.PROD_SSH_KEY }}
                  script: |
                    cd ${{ secrets.PROD_COMPOSE_DIR }}
                    docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml pull stats-service
                    docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d stats-service